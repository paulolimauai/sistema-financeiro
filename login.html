<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Login | Nexus Financeiro Hub</title>
    <!-- Fontes do Google: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #060a12;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #060a12; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 3px; }
        
        .form-fade {
            animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden bg-[#060a12]">

    <!-- Ondas Orbitais e Glow de Fundo -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
        <svg class="absolute w-full h-full opacity-20 stroke-amber-500/30" viewBox="0 0 1000 1000" fill="none">
            <ellipse cx="500" cy="500" rx="450" ry="250" stroke-width="1.5" transform="rotate(-15 500 500)" />
            <ellipse cx="500" cy="500" rx="550" ry="300" stroke-width="1.2" transform="rotate(-30 500 500)" />
            <ellipse cx="500" cy="500" rx="650" ry="350" stroke-width="0.8" transform="rotate(-45 500 500)" />
        </svg>
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-amber-500/10 rounded-full blur-[140px]"></div>
        <div class="absolute bottom-10 right-10 w-[400px] h-[400px] bg-blue-600/10 rounded-full blur-[140px]"></div>
    </div>

    <!-- Container Central de Autenticação (Responsivo PC e Mobile) -->
    <div class="w-full max-w-[420px] z-10 my-auto py-4">

        <!-- Card Principal (Identico a referencia) -->
        <div class="rounded-3xl border border-amber-500/30 p-7 sm:p-8 shadow-[0_20px_50px_rgba(0,0,0,0.8)] backdrop-blur-2xl bg-[#0e1628]/90 relative overflow-hidden">
            
            <!-- Topo: Badge de Logo S e Nome SISTEMA -->
            <div class="flex items-center justify-center gap-3 mb-4">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-amber-300 via-amber-400 to-sky-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-md shadow-amber-500/20">
                    S
                </div>
                <span class="text-base font-extrabold tracking-widest text-white uppercase">SISTEMA</span>
            </div>

            <!-- Titulo e Subtitulo -->
            <div class="text-center mb-6">
                <h2 id="authTitle" class="text-2xl font-extrabold tracking-tight text-white">Bem-vindo de volta</h2>
                <p id="authSub" class="mt-1 text-xs sm:text-sm text-gray-400">Acesse sua conta para gerenciar suas finanças.</p>
            </div>

            <!-- Form Box 1: Login -->
            <div id="loginBox" class="form-fade" style="display: block;">
                <form id="loginForm" class="space-y-4" onsubmit="handleLoginSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail</label>
                        <input id="loginEmail" name="email" type="email" autocomplete="username" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="seu.email@exemplo.com">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Senha</label>
                        <div class="relative">
                            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required 
                                class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                                placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs pt-1">
                        <label class="flex items-center gap-2 cursor-pointer select-none text-gray-300">
                            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-gray-900 border-gray-700 accent-amber-500 cursor-pointer" checked>
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="javascript:void(0)" onclick="switchAuthTab('forgot')" class="font-semibold text-amber-500 hover:text-amber-400 transition-colors">Esqueceu a senha?</a>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnLoginSubmit"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Entrar na Conta →
                        </button>
                    </div>
                </form>

                <!-- Divisor OU ENTRE COM -->
                <div class="relative my-6 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <span class="relative px-3 bg-[#0e1628] text-[11px] font-semibold text-gray-400 uppercase tracking-widest">OU ENTRE COM</span>
                </div>

                <!-- Botoes de Login Social -->
                <div class="flex justify-center gap-3">
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center hover:border-gray-600 transition-colors">
                        <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    </button>
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center hover:border-gray-600 transition-colors">
                        <svg class="w-5 h-5 fill-white" viewBox="0 0 24 24"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.85c.66-.8 1.12-1.92.99-3.04-.96.04-2.14.65-2.82 1.45-.6.69-1.12 1.83-.98 2.93 1.08.08 2.17-.54 2.81-1.34z"/></svg>
                    </button>
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center hover:border-gray-600 transition-colors">
                        <svg class="w-5 h-5 fill-[#0A66C2]" viewBox="0 0 24 24"><path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.74a1.65 1.65 0 0 0-1.66 1.66 1.66 1.66 0 0 0 1.66 1.65 1.65 1.65 0 0 0 1.65-1.65c0-.92-.74-1.66-1.65-1.66z"/></svg>
                    </button>
                </div>

                <p class="mt-6 text-center text-xs text-gray-400">
                    Não tem uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('register')" class="font-bold text-amber-500 hover:underline">Cadastrar-se</a>
                </p>
            </div>

            <!-- Form Box 2: Registro -->
            <div id="registerBox" class="form-fade" style="display: none;">
                <form id="registerForm" class="space-y-4" onsubmit="handleRegisterSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Nome Completo</label>
                        <input id="regName" name="regName" type="text" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="Seu nome completo">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail</label>
                        <input id="regEmail" name="regEmail" type="email" autocomplete="email" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="seu.email@exemplo.com">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Senha (mínimo 6 caracteres)</label>
                        <input id="regPassword" name="regPassword" type="password" minlength="6" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="••••••••">
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnRegisterSubmit"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Criar Conta →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-gray-400">
                    Já possui uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="font-bold text-amber-500 hover:underline">Fazer Login</a>
                </p>
            </div>

            <!-- Form Box 3: Recuperar Senha -->
            <div id="forgotBox" class="form-fade" style="display: none;">
                <div id="forgotAlert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium border"></div>

                <form id="forgotForm" class="space-y-4" onsubmit="handleForgotSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail Cadastrado</label>
                        <input id="forgotEmail" name="forgotEmail" type="email" autocomplete="email" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="seu.email@exemplo.com">
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnSendPassword"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Enviar Senha →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-gray-400">
                    Lembrou da senha? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="font-bold text-amber-500 hover:underline">Voltar para o Login</a>
                </p>
            </div>

        </div>

        <!-- Badge Footer: DESENVOLVEDOR PAULO LIMA (Idêntico à referência) -->
        <div class="mt-6 flex justify-center">
            <div class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-[#121929] border border-amber-500/40 shadow-[0_0_20px_rgba(232,176,75,0.25)] cursor-default">
                <span class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-md">
                    PL
                </span>
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-300">DESENVOLVEDOR</span>
                <span class="text-xs font-extrabold tracking-widest text-white">PAULO LIMA</span>
            </div>
        </div>

    </div>

    <script>
    const targetOrigin = (window.location.origin && window.location.origin.includes('http')) 
        ? window.location.origin 
        : 'http://localhost:3000';

    function switchAuthTab(tabName) {
        const loginBox = document.getElementById('loginBox');
        const registerBox = document.getElementById('registerBox');
        const forgotBox = document.getElementById('forgotBox');
        const authTitle = document.getElementById('authTitle');
        const authSub = document.getElementById('authSub');

        if (loginBox) loginBox.style.display = 'none';
        if (registerBox) registerBox.style.display = 'none';
        if (forgotBox) forgotBox.style.display = 'none';

        if (tabName === 'register') {
            if (registerBox) registerBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Criar Conta";
            if (authSub) authSub.innerText = "Cadastre-se gratuitamente para gerenciar suas finanças.";
        } else if (tabName === 'forgot') {
            if (forgotBox) forgotBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Recuperar Senha";
            if (authSub) authSub.innerText = "Informe seu e-mail cadastrado para enviarmos sua senha.";
        } else {
            if (loginBox) loginBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Bem-vindo de volta";
            if (authSub) authSub.innerText = "Acesse sua conta para gerenciar suas finanças.";
        }
    }

    async function handleLoginSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const btn = document.getElementById('btnLoginSubmit');

        if (!email || !password) {
            alert('Por favor, preencha o e-mail e a senha.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Entrando...`;

        try {
            const res = await fetch(targetOrigin + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'E-mail ou senha incorretos!');
                btn.disabled = false;
                btn.innerHTML = 'Entrar na Conta →';
                return false;
            }

            localStorage.setItem('nexus_session', JSON.stringify({ email: email }));
            localStorage.setItem('nexus_token', data.token);
            localStorage.setItem('nexus_cached_user', JSON.stringify(data.user));
            window.location.href = targetOrigin;
        } catch (err) {
            alert('Erro ao conectar ao servidor backend na porta 3000. Certifique-se de executar "npm start".');
            btn.disabled = false;
            btn.innerHTML = 'Entrar na Conta →';
        }
        return false;
    }

    async function handleRegisterSubmit(e) {
        if (e) e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const btn = document.getElementById('btnRegisterSubmit');

        if (!name || !email || !password) {
            alert('Por favor, preencha todos os campos.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Criando conta...`;

        try {
            const res = await fetch(targetOrigin + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'Erro ao criar conta.');
                btn.disabled = false;
                btn.innerHTML = 'Criar Conta →';
                return false;
            }

            alert('Conta criada com sucesso! Você pode fazer login agora.');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            switchAuthTab('login');
        } catch (err) {
            alert('Erro ao conectar ao servidor backend.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Criar Conta →';
        }
        return false;
    }

    async function handleForgotSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('btnSendPassword');
        const forgotAlert = document.getElementById('forgotAlert');

        if (!email) {
            alert('Por favor, informe seu e-mail.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Enviando...`;
        forgotAlert.classList.add('hidden');

        try {
            const res = await fetch(targetOrigin + '/api/send-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-red-900/30 border-red-500/40 text-red-300";
                forgotAlert.innerText = '⚠️ ' + (data.error || 'E-mail não encontrado.');
                forgotAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Enviar Senha →';
                return false;
            }

            if (data.mode === 'direct' && data.tempPassword) {
                forgotAlert.className = "mb-4 p-4 rounded-xl text-sm font-medium border bg-emerald-950/60 border-emerald-500/50 text-emerald-300 space-y-2";
                forgotAlert.innerHTML = `
                    <div>✅ <strong>Senha temporária gerada:</strong></div>
                    <div class="text-xl font-bold tracking-widest text-white bg-black/40 p-2.5 rounded-lg text-center font-mono select-all">${data.tempPassword}</div>
                    <button type="button" onclick="document.getElementById('loginEmail').value='${email}'; document.getElementById('loginPassword').value='${data.tempPassword}'; switchAuthTab('login');" class="mt-2 w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg transition-colors text-xs uppercase tracking-wider">
                        🔑 Preencher e Entrar Agora →
                    </button>
                `;
                forgotAlert.classList.remove('hidden');
            } else {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-900/30 border-emerald-500/40 text-emerald-300";
                forgotAlert.innerText = '✅ Instruções enviadas para o seu e-mail com sucesso!';
                forgotAlert.classList.remove('hidden');
            }

        } catch (err) {
            alert('Erro ao conectar ao servidor backend.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Enviar Senha →';
        }
        return false;
    }
    </script>
</body>
</html>
