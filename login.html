    <script>
        (function() {
            try {
                var t = localStorage.getItem('nexus_theme');
                if (t === 'light') {
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                }
                document.addEventListener('DOMContentLoaded', function() {
                    if (localStorage.getItem('nexus_theme') === 'light') {
                        document.body.classList.add('light');
                    } else {
                        document.body.classList.remove('light');
                    }
                });
            } catch(e){}
        })();
    </script>

    <script>
        // Determinar endpoint de API relativo ou fallback
        const targetOrigin = (window.location.origin && window.location.origin.includes('http')) 
            ? window.location.origin 
            : 'http://localhost:3000';

        // Sistema de Alerta Inline (Substitui alert nativo)
        window.showAlert = function(message, type = 'error') {
            const alertBox = document.getElementById('authAlert');
            if (!alertBox) return;

            alertBox.classList.remove('hidden', 'bg-rose-950/90', 'border-rose-500/60', 'text-rose-200',
                'bg-amber-950/90', 'border-amber-500/60', 'text-amber-200');

            let icon = '⚠️';
            if (type === 'success') {
                icon = '✨';
                alertBox.className = 'mb-4 p-3.5 rounded-xl text-xs font-semibold border bg-amber-950/90 border-amber-500/60 text-amber-200 shadow-lg shadow-amber-950/50 flex items-center gap-2.5 form-fade';
            } else if (type === 'info') {
                icon = '💡';
                alertBox.className = 'mb-4 p-3.5 rounded-xl text-xs font-semibold border bg-blue-950/90 border-blue-500/60 text-blue-200 shadow-lg shadow-blue-950/50 flex items-center gap-2.5 form-fade';
            } else {
                icon = '⚠️';
                alertBox.className = 'mb-4 p-3.5 rounded-xl text-xs font-semibold border bg-rose-950/90 border-rose-500/60 text-rose-200 shadow-lg shadow-rose-950/50 flex items-center gap-2.5 form-fade';
            }

            alertBox.innerHTML = `
                <span class="text-base shrink-0">${icon}</span>
                <span class="flex-1 leading-snug">${message}</span>
                <button type="button" onclick="document.getElementById('authAlert').classList.add('hidden')" class="opacity-70 hover:opacity-100 text-current ml-2 font-bold focus:outline-none">✕</button>
            `;
        };

        window.hideAlert = function() {
            const alertBox = document.getElementById('authAlert');
            if (alertBox) alertBox.classList.add('hidden');
        };

        // Função Global de Troca de Abas
        window.switchAuthTab = function(tabName) {
            hideAlert();
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            const forgotBox = document.getElementById('forgotBox');

            const authTitle = document.getElementById('authTitle');
            const authSub = document.getElementById('authSub');

            if (loginBox) loginBox.style.display = 'none';
            if (registerBox) registerBox.style.display = 'none';
            if (forgotBox) forgotBox.style.display = 'none';

            if (tabName === 'register') {
                if (registerBox) {
                    registerBox.style.display = 'block';
                    registerBox.classList.add('form-fade');
                }
                if (authTitle) authTitle.innerText = "Criar Nova Conta";
                if (authSub) authSub.innerText = "Cadastre-se para gerenciar suas finanças com inteligência.";
            } else if (tabName === 'forgot') {
                if (forgotBox) {
                    forgotBox.style.display = 'block';
                    forgotBox.classList.add('form-fade');
                }
                if (authTitle) authTitle.innerText = "Recuperar Senha";
                if (authSub) authSub.innerText = "Informe seu e-mail para receber um acesso temporário.";
            } else {
                if (loginBox) {
                    loginBox.style.display = 'block';
                    loginBox.classList.add('form-fade');
                }
                if (authTitle) authTitle.innerText = "Bem-vindo de volta";
                if (authSub) authSub.innerText = "Acesse sua conta para gerenciar suas finanças.";
            }
        };

        // Alternador de Visibilidade de Senha
        window.togglePasswordVisibility = function(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input || !btn) return;

            const eyeOpen = `<svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
            const eyeClosed = `<svg class="w-4 h-4 text-gray-500 hover:text-amber-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.05 10.05 0 013.682-.963c4.478 0 8.268 2.943 9.543 7a9.97 9.97 0 01-2.16 3.633m-1.503 1.503A9.956 9.956 0 0112 15c-1.42 0-2.755-.296-3.955-.831M3 3l18 18"/></svg>`;

            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = eyeOpen;
            } else {
                input.type = 'password';
                btn.innerHTML = eyeClosed;
            }
        };

        // Função de Acesso Rápido de Teste
        window.fillDemoCredentials = function(email, password, roleName) {
            const emailInput = document.getElementById('loginEmail');
            const passInput = document.getElementById('loginPassword');
            if (!emailInput || !passInput) return;

            emailInput.value = email;
            passInput.value = password;

            const emailWrapper = emailInput.closest('.input-wrapper-exact');
            const passWrapper = passInput.closest('.input-wrapper-exact');

            if (emailWrapper) emailWrapper.classList.add('field-highlight');
            if (passWrapper) passWrapper.classList.add('field-highlight');

            setTimeout(() => {
                if (emailWrapper) emailWrapper.classList.remove('field-highlight');
                if (passWrapper) passWrapper.classList.remove('field-highlight');
            }, 1200);

        window.toggleLoginTheme = function() {
            const isCurrentlyLight = document.body.classList.contains('light') || document.documentElement.classList.contains('light');
            const nextIsLight = !isCurrentlyLight;
            document.body.classList.toggle('light', nextIsLight);
            document.documentElement.classList.toggle('light', nextIsLight);
            localStorage.setItem('nexus_theme', nextIsLight ? 'light' : 'dark');
            const btn = document.getElementById('loginThemeBtn');
            const moonSvg = `<svg class="w-5 h-5 text-gray-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
            const sunSvg = `<svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M22 12h-2"/><path d="m4.93 19.07 1.41-1.41"/><path d="m17.66 6.34 1.41-1.41"/></svg>`;
            if (btn) btn.innerHTML = nextIsLight ? sunSvg : moonSvg;
        };

        window.showLoginSuccessModal = function(msg) {
            const overlay = document.getElementById('loginSuccessOverlay');
            if (!overlay) return;
            if (msg) {
                const msgEl = document.getElementById('loginSuccessMsg');
                if (msgEl) msgEl.textContent = msg;
            }
            overlay.style.display = 'flex';
            void overlay.offsetHeight;
            overlay.classList.remove('opacity-0');
            overlay.classList.add('opacity-100');
            const box = overlay.querySelector('div');
            if (box) {
                box.classList.remove('scale-95', 'translate-y-4');
                box.classList.add('scale-100', 'translate-y-0');
            }
        };
    </script>
</head>
<body class="h-full bg-[#12151A] text-gray-100 font-sans antialiased flex flex-col justify-center items-center min-h-screen py-10 px-4">

                        class="w-12 h-12 rounded-xl bg-[#141A28] border border-[#232D42] flex items-center justify-center hover:bg-[#1A2234] hover:border-amber-500/50 transition-all">
                        <svg class="w-5 h-5 fill-[#0A66C2]" viewBox="0 0 24 24">
                            <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.7a1.6 1.6 0 1 0 1.6 1.6 1.61 1.61 0 0 0-1.6-1.6z"/>
                        </svg>
                    </button>
                </div>

                <!-- Link de Cadastro -->
                <p class="mt-6 text-center text-xs text-[#8E9BAE]">
                    Não tem uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('register')" class="text-[#E5A93C] hover:underline font-extrabold ml-1">Cadastrar-se</a>
                </p>
            </div>

            <!-- FORMULÁRIO DE REGISTRO (CRIAR CONTA) -->
            <div id="registerBox" class="form-fade" style="display: none;">
                <form id="registerForm" class="space-y-4" onsubmit="handleRegisterSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-[#9AA8BA] mb-1.5">Nome Completo</label>
                        <div class="input-wrapper-exact">
                            <input id="regName" name="regName" type="text" required 
                                class="block w-full bg-transparent px-4 py-3.5 text-white placeholder-[#4C596D] text-sm focus:outline-none"
                                placeholder="Seu nome completo">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-[#9AA8BA] mb-1.5">E-mail</label>
                        <div class="input-wrapper-exact">
                            <input id="regEmail" name="regEmail" type="email" autocomplete="email" required 
                                class="block w-full bg-transparent px-4 py-3.5 text-white placeholder-[#4C596D] text-sm focus:outline-none"
                                placeholder="seu.email@exemplo.com">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-[#9AA8BA] mb-1.5">Senha (mínimo 6 caracteres)</label>
                        <div class="input-wrapper-exact flex items-center">
                            <input id="regPassword" name="regPassword" type="password" minlength="6" required
                                class="block w-full bg-transparent pl-4 pr-10 py-3.5 text-white placeholder-[#4C596D] text-sm focus:outline-none"
                                placeholder="••••••••">
                            <button type="button" id="btnToggleRegPass" onclick="togglePasswordVisibility('regPassword', 'btnToggleRegPass')" class="pr-3 text-gray-500 hover:text-amber-400 transition-colors focus:outline-none">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnRegisterSubmit"
                            class="btn-gold-blue-gradient w-full py-4 text-sm font-extrabold flex items-center justify-center gap-2 focus:outline-none">
                            Criar Minha Conta →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-[#8E9BAE]">
                    Já possui uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="text-[#E5A93C] hover:underline font-extrabold ml-1">Fazer Login</a>
                </p>
            </div>

            <!-- FORMULÁRIO DE RECUPERAÇÃO -->
            <div id="forgotBox" class="form-fade" style="display: none;">
                <form id="forgotForm" class="space-y-4" onsubmit="handleForgotSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-[#9AA8BA] mb-1.5">E-mail Cadastrado</label>
                        <div class="input-wrapper-exact">
                            <input id="forgotEmail" name="forgotEmail" type="email" autocomplete="email" required 
                                class="block w-full bg-transparent px-4 py-3.5 text-white placeholder-[#4C596D] text-sm focus:outline-none"
                                placeholder="seu.email@exemplo.com">
                        </div>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnSendPassword"
                            class="btn-gold-blue-gradient w-full py-4 text-sm font-extrabold flex items-center justify-center gap-2 focus:outline-none">
                            Gerar Nova Senha →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-[#8E9BAE]">
                    Lembrou da senha? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="text-[#E5A93C] hover:underline font-extrabold ml-1">Voltar ao Login</a>
                </p>
            </div>

        </div>

        <!-- CHIP DE DESTAQUE DO DESENVOLVEDOR PAULO LIMA (100% IDÊNTICO À FOTO DO USUÁRIO) -->
        <div class="mt-6 flex justify-center">
            <div class="inline-flex items-center gap-3 px-6 py-2.5 rounded-full bg-[#0E1322]/95 border border-[#C89B3C] shadow-[0_0_25px_rgba(200,155,60,0.35)] backdrop-blur-2xl transition-transform hover:scale-105">
                <span class="w-8 h-8 rounded-full bg-gradient-to-br from-[#E6C675] to-[#C89B3C] text-[#0A0F1A] font-black text-xs flex items-center justify-center shadow-md">
                    PL
                </span>
                <div class="flex items-center gap-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-[#D4A84B]">DESENVOLVEDOR</span>
                    <span class="text-sm font-extrabold tracking-wider text-white">PAULO LIMA</span>
                </div>
            </div>
        </div>

    </div>

    <script>
    // 1. Submit Login
    async function handleLoginSubmit(e) {
        if (e) e.preventDefault();
        hideAlert();

        const emailInput = document.getElementById('loginEmail');
        const passInput = document.getElementById('loginPassword');
        const btn = document.getElementById('btnLoginSubmit');

        const email = emailInput ? emailInput.value.trim() : '';
        const password = passInput ? passInput.value.trim() : '';

        if (!email || !password) {
            showAlert('Por favor, preencha o e-mail e a senha.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-[#0A0F1A] inline mr-1.5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Entrando...`;

        try {
            const apiUrl = targetOrigin.endsWith('/') ? targetOrigin + 'api/login' : targetOrigin + '/api/login';
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                showAlert(data.error || 'E-mail ou senha incorretos!', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Entrar na Conta →';
                return false;
            }

            showLoginSuccessModal('Login efetuado com sucesso!');
            localStorage.setItem('nexus_session', JSON.stringify({ email: email }));
            localStorage.setItem('nexus_token', data.token);
            localStorage.setItem('nexus_cached_user', JSON.stringify(data.user));
            localStorage.setItem('nexus_just_logged_in', 'true');
            sessionStorage.setItem('nexus_just_logged_in', 'true');

            setTimeout(() => {
                window.location.href = targetOrigin;
            }, 1400);

        } catch (err) {
            showAlert('Erro ao conectar ao servidor backend (porta 3000). Verifique se o comando "npm start" está rodando.', 'error');
            btn.disabled = false;
            btn.innerHTML = 'Entrar na Conta →';
        }
        return false;
    }

    // 2. Submit Register
    async function handleRegisterSubmit(e) {
        if (e) e.preventDefault();
        hideAlert();

        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const btn = document.getElementById('btnRegisterSubmit');

        if (!name || !email || !password) {
            showAlert('Por favor, preencha todos os campos obrigatórios.');
            return false;
        }

        if (password.length < 6) {
            showAlert('A senha deve ter no mínimo 6 caracteres.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-[#0A0F1A] inline mr-1.5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Criando conta...`;

        try {
            const apiUrl = targetOrigin.endsWith('/') ? targetOrigin + 'api/register' : targetOrigin + '/api/register';
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                showAlert(data.error || 'Erro ao criar conta.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Criar Minha Conta →';
                return false;
            }

            showAlert('Conta criada com sucesso! Preenchemos suas credenciais para entrar.', 'success');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            setTimeout(() => {
                switchAuthTab('login');
            }, 1000);

        } catch (err) {
            showAlert('Erro ao conectar ao servidor backend (porta 3000). Verifique se o comando "npm start" está rodando.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Criar Minha Conta →';
        }
        return false;
    }

    // 3. Submit Forgot Password
    async function handleForgotSubmit(e) {
        if (e) e.preventDefault();
        hideAlert();

        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('btnSendPassword');

        if (!email) {
            showAlert('Por favor, informe seu e-mail cadastrado.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-[#0A0F1A] inline mr-1.5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Enviando...`;

        try {
            const apiUrl = targetOrigin.endsWith('/') ? targetOrigin + 'api/send-password' : targetOrigin + '/api/send-password';
            const res = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                showAlert(data.error || 'E-mail não encontrado no sistema.', 'error');
                btn.disabled = false;
                btn.innerHTML = 'Gerar Nova Senha →';
                return false;
            }

            if (data.mode === 'direct' && data.tempPassword) {
                showAlert(`<strong>Senha temporária gerada:</strong> <code class="bg-black/50 px-2 py-0.5 rounded text-amber-300 font-mono text-sm">${data.tempPassword}</code>. Preenchemos para você entrar.`, 'success');
                document.getElementById('loginEmail').value = email;
                document.getElementById('loginPassword').value = data.tempPassword;
                setTimeout(() => {
                    switchAuthTab('login');
                }, 1800);
            } else {
                showAlert('Instruções de redefinição enviadas para o seu e-mail com sucesso!', 'success');
            }

        } catch (err) {
            showAlert('Erro ao conectar ao servidor backend (porta 3000). Verifique se o comando "npm start" está rodando.', 'error');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Gerar Nova Senha →';
        }
        return false;
    }

    // Engine de Linhas Orbitais Glowing no Fundo (Idêntico ao Fundo da Foto)
    (function initBgOrbital() {
        const canvas = document.getElementById('bgOrbitalCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        let angle = 0;
        function render() {
            ctx.clearRect(0, 0, width, height);
            angle += 0.002;

            const cx = width / 2;
            const cy = height / 2;

            // Desenhar elipses e espirais luminosas douradas e azuis
            for (let i = 1; i <= 6; i++) {
                const rx = (width * 0.38) + (i * 45);
                const ry = (height * 0.42) + (i * 35);

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle * (i % 2 === 0 ? 1 : -1) + (i * 0.2));

                ctx.beginPath();
                ctx.ellipse(0, 0, rx, ry, Math.PI / 6, 0, Math.PI * 2);
                ctx.lineWidth = 1;

                if (i % 2 === 0) {
                    ctx.strokeStyle = `rgba(200, 155, 60, ${0.12 - (i * 0.015)})`;
                } else {
                    ctx.strokeStyle = `rgba(91, 148, 217, ${0.12 - (i * 0.015)})`;
                }
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }
        render();
    })();
    </script>
</body>
