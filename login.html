<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Login | Nexus Financeiro Hub</title>
    <!-- Fontes do Google: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background: linear-gradient(180deg, rgba(7, 12, 24, 0.78) 0%, rgba(9, 14, 28, 0.85) 100%), url('/images/nexus_bg_4k.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #e2e8f0;
            overflow-x: hidden;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #070c18; }
        ::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 3px; }
        
        .glass-box {
            background: rgba(14, 22, 40, 0.78) !important;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(232, 176, 75, 0.28) !important;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .form-fade {
            animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">

    <!-- Ondas Orbitais e Glow de Fundo (Identico ao Screenshot do PC) -->
    <div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
        <svg class="absolute w-full h-full opacity-35" viewBox="0 0 1600 1000" fill="none">
            <ellipse cx="300" cy="500" rx="800" ry="400" stroke="url(#goldOrbGrad)" stroke-width="1.2" transform="rotate(-18 300 500)" />
            <ellipse cx="1300" cy="500" rx="900" ry="450" stroke="url(#blueOrbGrad)" stroke-width="1.2" transform="rotate(22 1300 500)" />
            <defs>
                <linearGradient id="goldOrbGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#e8b04b" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#b45309" stop-opacity="0.05"/>
                </linearGradient>
                <linearGradient id="blueOrbGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.7"/>
                    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.05"/>
                </linearGradient>
            </defs>
        </svg>
        <div class="absolute top-1/2 left-1/4 -translate-y-1/2 w-[550px] h-[550px] bg-amber-500/10 rounded-full blur-[150px]"></div>
        <div class="absolute top-1/2 right-1/4 -translate-y-1/2 w-[600px] h-[600px] bg-blue-600/10 rounded-full blur-[160px]"></div>
    </div>

    <!-- Container Central de Autenticação (Responsivo PC e Mobile) -->
    <div class="w-full max-w-[430px] z-10 my-auto py-4">

        <!-- Card Principal Glassmorphism -->
        <div class="rounded-3xl border border-emerald-500/30 p-7 sm:p-9 shadow-[0_25px_60px_rgba(0,0,0,0.85),0_0_30px_rgba(16,185,129,0.15)] backdrop-blur-3xl bg-[#0a1120]/85 relative overflow-hidden">
            
            <!-- Topo: Marca Nexus & Badge de Segurança Executiva -->
            <div class="flex flex-col items-center justify-center gap-2 mb-6">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-emerald-400 via-teal-500 to-amber-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-emerald-500/25 shrink-0">
                        N
                    </div>
                    <div class="flex flex-col text-left">
                        <span class="text-lg font-extrabold tracking-widest text-white uppercase leading-none">NEXUS</span>
                        <span class="text-[10px] font-bold tracking-widest text-amber-400 uppercase mt-0.5">FINANCEIRO HUB</span>
                    </div>
                </div>

                <div class="inline-flex items-center gap-1.5 px-3 py-1 mt-1 rounded-full bg-emerald-950/60 border border-emerald-500/40 text-[10.5px] font-bold text-emerald-400 tracking-wider uppercase shadow-inner">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                    ACESSO SEGURO SSL 256-BIT
                </div>
            </div>

            <!-- Titulo e Subtitulo -->
            <div class="text-center mb-6">
                <h2 id="authTitle" class="text-2xl font-extrabold tracking-tight text-white">Acesso Executivo</h2>
                <p id="authSub" class="mt-1 text-xs sm:text-sm text-gray-400">Informe suas credenciais para acessar seu painel financeiro.</p>
            </div>

            <!-- Form Box 1: Login -->
            <div id="loginBox" class="form-fade" style="display: block;">
                <form id="loginForm" class="space-y-4" onsubmit="handleLoginSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Endereço de E-mail</label>
                        <input id="loginEmail" name="email" type="email" autocomplete="username" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#070d19]/80 border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all"
                            placeholder="seu.email@empresa.com.br">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Senha de Acesso</label>
                        <div class="relative flex items-center">
                            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required 
                                class="w-full px-4 py-3 pr-10 rounded-xl bg-[#070d19]/80 border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all"
                                placeholder="••••••••">
                            <button type="button" onclick="togglePasswordVisibility('loginPassword', this)" class="absolute right-3 text-gray-400 hover:text-gray-200 focus:outline-none">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center justify-between text-xs pt-1">
                        <label class="flex items-center gap-2 cursor-pointer select-none text-gray-300">
                            <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-gray-900 border-gray-700 accent-amber-500 cursor-pointer" checked>
                            <span>Lembrar de mim</span>
                        </label>
                        <a href="javascript:void(0)" onclick="switchAuthTab('forgot')" class="font-semibold text-amber-500 hover:text-amber-400 transition-colors">Esqueceu a senha?</a>
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnLoginSubmit"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Entrar na Conta →
                        </button>
                    </div>
                </form>

                <!-- Divisor OU ENTRE COM -->
                <div class="relative my-6 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-800"></div></div>
                    <span class="relative px-3 bg-[#0e1628] text-[11px] font-semibold text-gray-400 uppercase tracking-widest">OU ENTRE COM</span>
                </div>

                <!-- Botoes de Login Social G, Apple, LinkedIn -->
                <div class="flex justify-center gap-3">
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center text-white font-extrabold text-sm hover:border-amber-500/50 hover:bg-[#18233b] transition-all">
                        G
                    </button>
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center text-white font-extrabold text-sm hover:border-amber-500/50 hover:bg-[#18233b] transition-all">
                        
                    </button>
                    <button type="button" class="w-12 h-12 rounded-xl bg-[#131b2e] border border-gray-800 flex items-center justify-center text-sky-400 font-extrabold text-sm hover:border-amber-500/50 hover:bg-[#18233b] transition-all">
                        in
                    </button>
                </div>

                <p class="mt-6 text-center text-xs text-gray-400">
                    Não tem uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('register')" class="font-bold text-amber-500 hover:underline">Cadastrar-se</a>
                </p>
            </div>

            <!-- Form Box 2: Registro -->
            <div id="registerBox" class="form-fade" style="display: none;">
                <form id="registerForm" class="space-y-4" onsubmit="handleRegisterSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Nome Completo</label>
                        <input id="regName" name="regName" type="text" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="Seu nome completo">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail</label>
                        <input id="regEmail" name="regEmail" type="email" autocomplete="email" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="seu.email@exemplo.com">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">Senha (mínimo 6 caracteres)</label>
                        <input id="regPassword" name="regPassword" type="password" minlength="6" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="••••••••">
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnRegisterSubmit"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Criar Conta →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-gray-400">
                    Já possui uma conta? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="font-bold text-amber-500 hover:underline">Fazer Login</a>
                </p>
            </div>

            <!-- Form Box 3: Recuperar Senha -->
            <div id="forgotBox" class="form-fade" style="display: none;">
                <div id="forgotAlert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium border"></div>

                <form id="forgotForm" class="space-y-4" onsubmit="handleForgotSubmit(event); return false;">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1.5">E-mail Cadastrado</label>
                        <input id="forgotEmail" name="forgotEmail" type="email" autocomplete="email" required 
                            class="w-full px-4 py-3 rounded-xl bg-[#131b2e] border border-gray-700/60 text-white placeholder-gray-500 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all"
                            placeholder="seu.email@exemplo.com">
                    </div>

                    <div class="pt-2">
                        <button type="submit" id="btnSendPassword"
                            class="w-full py-3.5 px-4 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-300 to-sky-400 hover:opacity-95 shadow-lg shadow-amber-500/25 transition-all uppercase tracking-wider flex items-center justify-center gap-2">
                            Enviar Senha →
                        </button>
                    </div>
                </form>
                <p class="mt-6 text-center text-xs text-gray-400">
                    Lembrou da senha? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="font-bold text-amber-500 hover:underline">Voltar para o Login</a>
                </p>
            </div>

        </div>

        <!-- Badge Footer: DESENVOLVEDOR PAULO LIMA (Idêntico ao Screenshot do PC) -->
        <div class="mt-6 flex justify-center">
            <div class="inline-flex items-center gap-2.5 px-5 py-2.5 rounded-full bg-[#121929] border border-amber-500/40 shadow-[0_0_20px_rgba(232,176,75,0.25)] cursor-default">
                <span class="w-6 h-6 rounded-full bg-amber-500 text-slate-950 font-black text-xs flex items-center justify-center shadow-md">
                    PL
                </span>
                <span class="text-[11px] font-bold uppercase tracking-wider text-amber-300">DESENVOLVEDOR</span>
                <span class="text-xs font-extrabold tracking-widest text-white">PAULO LIMA</span>
            </div>
        </div>

    </div>

    <script>
    const targetOrigin = (window.location.origin && window.location.origin !== 'null' && window.location.origin.includes('http')) 
        ? window.location.origin 
        : '';

    function togglePasswordVisibility(inputId, btn) {
        const input = document.getElementById(inputId);
        if (!input) return;
        if (input.type === 'password') {
            input.type = 'text';
        } else {
            input.type = 'password';
        }
    }

    function switchAuthTab(tabName) {
        const loginBox = document.getElementById('loginBox');
        const registerBox = document.getElementById('registerBox');
        const forgotBox = document.getElementById('forgotBox');
        const authTitle = document.getElementById('authTitle');
        const authSub = document.getElementById('authSub');

        if (loginBox) loginBox.style.display = 'none';
        if (registerBox) registerBox.style.display = 'none';
        if (forgotBox) forgotBox.style.display = 'none';

        if (tabName === 'register') {
            if (registerBox) registerBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Criar Conta";
            if (authSub) authSub.innerText = "Cadastre-se gratuitamente para gerenciar suas finanças.";
        } else if (tabName === 'forgot') {
            if (forgotBox) forgotBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Recuperar Senha";
            if (authSub) authSub.innerText = "Informe seu e-mail cadastrado para enviarmos sua senha.";
        } else {
            if (loginBox) loginBox.style.display = 'block';
            if (authTitle) authTitle.innerText = "Acesso Executivo";
            if (authSub) authSub.innerText = "Informe suas credenciais para acessar seu painel financeiro.";
        }
    }

    async function handleLoginSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const btn = document.getElementById('btnLoginSubmit');

        if (!email || !password) {
            alert('Por favor, preencha o e-mail e a senha.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Entrando...`;

        try {
            const res = await fetch(targetOrigin + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'E-mail ou senha incorretos!');
                btn.disabled = false;
                btn.innerHTML = 'Entrar na Conta →';
                return false;
            }

            localStorage.setItem('nexus_session', JSON.stringify({ email: email }));
            localStorage.setItem('nexus_token', data.token);
            localStorage.setItem('nexus_cached_user', JSON.stringify(data.user));
            window.location.href = targetOrigin || '/';
        } catch (err) {
            alert('Erro ao conectar ao servidor. Verifique sua conexão e tente novamente.');
            btn.disabled = false;
            btn.innerHTML = 'Entrar na Conta →';
        }
        return false;
    }

    async function handleRegisterSubmit(e) {
        if (e) e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const btn = document.getElementById('btnRegisterSubmit');

        if (!name || !email || !password) {
            alert('Por favor, preencha todos os campos.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Criando conta...`;

        try {
            const res = await fetch(targetOrigin + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'Erro ao criar conta.');
                btn.disabled = false;
                btn.innerHTML = 'Criar Conta →';
                return false;
            }

            alert('Conta criada com sucesso! Você pode fazer login agora.');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            switchAuthTab('login');
        } catch (err) {
            alert('Erro ao conectar ao servidor backend.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Criar Conta →';
        }
        return false;
    }

    async function handleForgotSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('btnSendPassword');
        const forgotAlert = document.getElementById('forgotAlert');

        if (!email) {
            alert('Por favor, informe seu e-mail.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `Enviando...`;
        forgotAlert.classList.add('hidden');

        try {
            const res = await fetch(targetOrigin + '/api/send-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-red-900/30 border-red-500/40 text-red-300";
                forgotAlert.innerText = '⚠️ ' + (data.error || 'E-mail não encontrado.');
                forgotAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Enviar Senha →';
                return false;
            }

            if (data.mode === 'direct' && data.tempPassword) {
                forgotAlert.className = "mb-4 p-4 rounded-xl text-sm font-medium border bg-emerald-950/60 border-emerald-500/50 text-emerald-300 space-y-2";
                forgotAlert.innerHTML = `
                    <div>✅ <strong>Senha temporária gerada:</strong></div>
                    <div class="text-xl font-bold tracking-widest text-white bg-black/40 p-2.5 rounded-lg text-center font-mono select-all">${data.tempPassword}</div>
                    <button type="button" onclick="document.getElementById('loginEmail').value='${email}'; document.getElementById('loginPassword').value='${data.tempPassword}'; switchAuthTab('login');" class="mt-2 w-full py-2 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-lg transition-colors text-xs uppercase tracking-wider">
                        🔑 Preencher e Entrar Agora →
                    </button>
                `;
                forgotAlert.classList.remove('hidden');
            } else {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-900/30 border-emerald-500/40 text-emerald-300";
                forgotAlert.innerText = '✅ Instruções enviadas para o seu e-mail com sucesso!';
                forgotAlert.classList.remove('hidden');
            }

        } catch (err) {
            alert('Erro ao conectar ao servidor backend.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Enviar Senha →';
        }
        return false;
    }
    </script>
</body>
</html>
