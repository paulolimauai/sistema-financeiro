<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus Financeiro Hub</title>
    <!-- Fontes do Google: Plus Jakarta Sans & Inter -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Tailwind CSS CDN para estilização dinâmica e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        finance: {
                            dark: '#060B18',
                            card: '#10182D',
                            cardHover: '#16203D',
                            accent: '#06D6A0',
                            accentHover: '#05b385',
                            cyan: '#00E5FF',
                            purple: '#6366F1'
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'float-delayed': 'float 6s ease-in-out 3s infinite',
                        'glow-pulse': 'glowPulse 3s infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glowPulse: {
                            '0%': { opacity: 0.4, transform: 'scale(1)' },

                    }

            }
        }

    <style>
        body {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            background-color: #060B18;
            overflow-x: hidden;
        }
        .auth-tab {
            padding: 10px 16px;
            border-radius: 10px;
            color: #9ca3af;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            background: transparent;
            border: 1px solid transparent;
            user-select: none;
        }
        .auth-tab:hover {
            color: #f3f4f6;
            background: rgba(232, 176, 75, 0.08);
            border-color: rgba(232, 176, 75, 0.2);
        }
        .auth-tab.active {
            color: #fbbf24;
            background: linear-gradient(135deg, rgba(232, 176, 75, 0.22) 0%, rgba(201, 134, 42, 0.18) 100%);
            border-color: rgba(232, 176, 75, 0.5);
            box-shadow: 0 0 22px rgba(232, 176, 75, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            font-weight: 700;
        }
        .glass-card-3d {
            background: rgba(10, 15, 29, 0.88);
            backdrop-filter: blur(32px);
            -webkit-backdrop-filter: blur(32px);
            border: 1.5px solid rgba(232, 176, 75, 0.35);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85), 0 0 40px rgba(232, 176, 75, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.2s ease;
            transform-style: preserve-3d;
        }
        .input-wrapper {
            position: relative;
            background: rgba(8, 12, 22, 0.85);
            border-color: rgba(232, 176, 75, 0.25) !important;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-wrapper:focus-within {
            border-color: rgba(245, 197, 102, 0.9) !important;
            box-shadow: 0 0 25px rgba(232, 176, 75, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
            transform: translateY(-1px);
        }
        .input-wrapper:focus-within svg {
            color: #fbbf24 !important;
        }
        /* Custom Checkbox */
        .custom-checkbox {
            accent-color: #fbbf24;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #060B18;
        }
        ::-webkit-scrollbar-thumb {
            background: #1f293d;
            border-radius: 3px;
        }
        /* Smooth Fade Animation for Forms */
        .form-fade {
            animation: fadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        // Função Global de Troca de Abas
        window.switchAuthTab = function(tabName) {
            const loginBox = document.getElementById('loginBox');
            const registerBox = document.getElementById('registerBox');
            const forgotBox = document.getElementById('forgotBox');

            const tabLogin = document.getElementById('tabAuthLogin') || document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabAuthRegister') || document.getElementById('tabRegister');
            const tabForgot = document.getElementById('tabAuthForgot') || document.getElementById('tabForgot');

            const authTitle = document.getElementById('authTitle');
            const authSub = document.getElementById('authSub');

            if (tabLogin) tabLogin.classList.remove('active');
            if (tabRegister) tabRegister.classList.remove('active');
            if (tabForgot) tabForgot.classList.remove('active');

            if (loginBox) loginBox.style.display = 'none';
            if (registerBox) registerBox.style.display = 'none';
            if (forgotBox) forgotBox.style.display = 'none';

            if (tabName === 'register') {
                if (registerBox) {
                    registerBox.style.display = 'block';
                    registerBox.classList.add('form-fade');
                }
                if (tabRegister) tabRegister.classList.add('active');
                if (authTitle) authTitle.innerText = "Criar nova conta";
                if (authSub) authSub.innerText = "Cadastre-se gratuitamente para gerenciar seu dinheiro com facilidade.";
            } else if (tabName === 'forgot') {
                if (forgotBox) {
                    forgotBox.style.display = 'block';
                    forgotBox.classList.add('form-fade');
                }
                if (tabForgot) tabForgot.classList.add('active');
                if (authTitle) authTitle.innerText = "Recuperar sua senha";
                if (authSub) authSub.innerText = "Informe seu e-mail cadastrado para redefinir sua credencial.";
            } else {
                if (loginBox) {
                    loginBox.style.display = 'block';
                    loginBox.classList.add('form-fade');
                }
                if (tabLogin) tabLogin.classList.add('active');
                if (authTitle) authTitle.innerText = "Acessar sua conta";
                if (authSub) authSub.innerText = "Gerencie seu patrimônio com segurança, clareza e inteligência.";
            }
        };

        // Alternador de Visibilidade de Senha
        window.togglePasswordVisibility = function(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (!input) return;
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg class="w-4 h-4 text-finance-accent" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858-5.908a10.05 10.05 0 013.682-.963c4.478 0 8.268 2.943 9.543 7a9.97 9.97 0 01-2.16 3.633m-1.503 1.503A9.956 9.956 0 0112 15c-1.42 0-2.755-.296-3.955-.831M3 3l18 18"/></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg class="w-4 h-4 text-gray-400 hover:text-gray-200" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>`;
            }
        };

        // Carrossel do Showcase Direito (3 Widgets)
        let currentWidgetIndex = 1;
        let showcaseTimer = null;

        window.switchShowcaseWidget = function(widgetIndex) {
            currentWidgetIndex = widgetIndex;
            const card1 = document.getElementById('widgetCard1');
            const card2 = document.getElementById('widgetCard2');
            const card3 = document.getElementById('widgetCard3');

            const dot1 = document.getElementById('widgetDot1');
            const dot2 = document.getElementById('widgetDot2');
            const dot3 = document.getElementById('widgetDot3');

            if (card1) card1.classList.add('hidden');
            if (card2) card2.classList.add('hidden');
            if (card3) card3.classList.add('hidden');

            if (dot1) { dot1.classList.remove('bg-finance-accent', 'w-6'); dot1.classList.add('bg-gray-700', 'w-2'); }
            if (dot2) { dot2.classList.remove('bg-finance-accent', 'w-6'); dot2.classList.add('bg-gray-700', 'w-2'); }
            if (dot3) { dot3.classList.remove('bg-finance-accent', 'w-6'); dot3.classList.add('bg-gray-700', 'w-2'); }

            if (widgetIndex === 2) {
                if (card2) card2.classList.remove('hidden');
                if (dot2) { dot2.classList.remove('bg-gray-700', 'w-2'); dot2.classList.add('bg-finance-accent', 'w-6'); }
            } else if (widgetIndex === 3) {
                if (card3) card3.classList.remove('hidden');
                if (dot3) { dot3.classList.remove('bg-gray-700', 'w-2'); dot3.classList.add('bg-finance-accent', 'w-6'); }
            } else {
                if (card1) card1.classList.remove('hidden');
                if (dot1) { dot1.classList.remove('bg-gray-700', 'w-2'); dot1.classList.add('bg-finance-accent', 'w-6'); }
            }
        };

        function startShowcaseAutoRotate() {
            if (showcaseTimer) clearInterval(showcaseTimer);
            showcaseTimer = setInterval(() => {
                let next = currentWidgetIndex + 1;
                if (next > 3) next = 1;
                switchShowcaseWidget(next);
            }, 5000);
        }

        function stopShowcaseAutoRotate() {
            if (showcaseTimer) clearInterval(showcaseTimer);
        }

        document.addEventListener('DOMContentLoaded', () => {
            startShowcaseAutoRotate();
            const card = document.getElementById('tiltCard');
            if (card) {
                card.addEventListener('mouseenter', stopShowcaseAutoRotate);
                card.addEventListener('mouseleave', startShowcaseAutoRotate);
            }
        });
    </script>
</head>
<body class="h-full bg-[#060B18] text-gray-100 font-sans antialiased selection:bg-finance-accent selection:text-finance-dark flex flex-col justify-center items-center min-h-screen">

                <!-- Box 3: Formulário de Recuperar Senha -->
                <div id="forgotBox" class="mt-6 form-fade" style="display: none;">
                    <div id="forgotAlert" class="hidden mb-4 p-3.5 rounded-xl text-xs font-medium border"></div>

                    <form id="forgotForm" class="space-y-4" onsubmit="handleForgotSubmit(event); return false;">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-gray-300 mb-1.5">E-mail Cadastrado</label>
                            <div class="input-wrapper rounded-xl border border-gray-700/80 bg-gray-950/70 transition-all">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                    <svg class="w-4 h-4 transition-colors" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                                </div>
                                <input id="forgotEmail" name="forgotEmail" type="email" autocomplete="email" required 
                                    class="block w-full rounded-xl bg-transparent pl-10 pr-4 py-3 text-white placeholder-gray-500 text-sm focus:outline-none transition-all"
                                    placeholder="seu.email@exemplo.com">
                            </div>
                        </div>

                        <div class="pt-2">
                            <button type="submit" id="btnSendPassword"
                                class="w-full flex items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-amber-500 via-amber-400 to-amber-500 px-4 py-3.5 text-sm font-extrabold text-slate-950 shadow-lg shadow-amber-500/25 hover:shadow-amber-500/40 hover:opacity-95 transition-all focus:outline-none active:scale-[0.99] uppercase tracking-wider">
                                Enviar / Gerar Nova Senha →
                            </button>
                        </div>
                    </form>
                    <p class="mt-5 text-center text-xs text-gray-400">
                        Lembrou da senha? <a href="javascript:void(0)" onclick="switchAuthTab('login')" class="text-amber-400 hover:underline font-semibold">Voltar para o Login</a>
                    </p>
                </div>

                <!-- Rodapé Interno: Aviso de Segurança -->
                <div class="mt-6 pt-4 border-t border-gray-800/80 flex items-center justify-between text-[11px] text-gray-400">
                    <div class="flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-amber-400 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        <span>Ambiente Criptografado SSL</span>
                    </div>
                    <span class="font-mono text-gray-400 text-[10px]">v1.2.0</span>
                </div>

            </div>

            <!-- CHIP DE DESTAQUE DO DESENVOLVEDOR PAULO LIMA (4K ILLUMINATED BADGE) -->
            <div class="mt-6 flex justify-center">
                <div class="inline-flex items-center gap-3 px-6 py-2.5 rounded-full bg-gradient-to-r from-amber-950/90 via-slate-950/95 to-amber-950/90 border border-amber-500/50 shadow-[0_0_25px_rgba(232,176,75,0.3)] backdrop-blur-2xl hover:scale-105 transition-all duration-300 group cursor-default">
                    <span class="relative flex items-center justify-center w-7 h-7 rounded-full bg-gradient-to-tr from-amber-500 via-amber-400 to-yellow-300 text-slate-950 font-black text-xs shadow-md shadow-amber-500/40 ring-2 ring-amber-400/50">
                        PL
                    </span>
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] font-bold uppercase tracking-wider text-amber-200/90">DESENVOLVEDOR</span>
                        <span class="text-sm font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-100 to-amber-400 drop-shadow-[0_0_12px_rgba(232,176,75,0.9)]">PAULO LIMA</span>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <script>
    const targetOrigin = (window.location.origin && window.location.origin.includes('http')) 
        ? window.location.origin 
        : 'http://localhost:3000';

    // 1. Submit Login (Normal Credential Submit)
    async function handleLoginSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const btn = document.getElementById('btnLoginSubmit');

        if (!email || !password) {
            alert('Por favor, preencha o e-mail e a senha.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-finance-dark inline mr-1" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Entrando...`;

        try {
            const res = await fetch(targetOrigin + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'E-mail ou senha incorretos!');
                btn.disabled = false;
                btn.innerHTML = 'Entrar no Sistema →';
                return false;
            }

            localStorage.setItem('nexus_session', JSON.stringify({ email: email }));
            localStorage.setItem('nexus_token', data.token);
            localStorage.setItem('nexus_cached_user', JSON.stringify(data.user));
            window.location.href = targetOrigin;
        } catch (err) {
            alert('Erro ao conectar ao servidor backend na porta 3000. Certifique-se de executar "npm start".');
            btn.disabled = false;
            btn.innerHTML = 'Entrar no Sistema →';
        }
        return false;
    }

    // 2. Submit Register
    async function handleRegisterSubmit(e) {
        if (e) e.preventDefault();
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const btn = document.getElementById('btnRegisterSubmit');

        if (!name || !email || !password) {
            alert('Por favor, preencha todos os campos obrigatórios.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-finance-dark inline mr-1" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Criando conta...`;

        try {
            const res = await fetch(targetOrigin + '/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                alert(data.error || 'Erro ao criar conta.');
                btn.disabled = false;
                btn.innerHTML = 'Criar Minha Conta Pessoal →';
                return false;
            }

            alert('Conta criada com sucesso! Você pode fazer login agora.');
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = password;
            switchAuthTab('login');
        } catch (err) {
            alert('Erro ao conectar ao servidor backend na porta 3000. Certifique-se de executar "npm start".');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Criar Minha Conta Pessoal →';
        }
        return false;
    }

    // 3. Submit Forgot Password
    async function handleForgotSubmit(e) {
        if (e) e.preventDefault();
        const email = document.getElementById('forgotEmail').value.trim();
        const btn = document.getElementById('btnSendPassword');
        const forgotAlert = document.getElementById('forgotAlert');

        if (!email) {
            alert('Por favor, informe seu e-mail cadastrado.');
            return false;
        }

        btn.disabled = true;
        btn.innerHTML = `<svg class="w-4 h-4 animate-spin text-finance-dark inline mr-1" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Enviando...`;
        forgotAlert.classList.add('hidden');

        try {
            const res = await fetch(targetOrigin + '/api/send-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-red-900/30 border-red-500/40 text-red-300";
                forgotAlert.innerText = '⚠️ ' + (data.error || 'E-mail não encontrado.');
                forgotAlert.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = 'Enviar / Gerar Nova Senha →';
                return false;
            }

            if (data.mode === 'direct' && data.tempPassword) {
                forgotAlert.className = "mb-4 p-4 rounded-xl text-sm font-medium border bg-emerald-950/60 border-emerald-500/50 text-emerald-300 space-y-2";
                forgotAlert.innerHTML = `
                    <div>✅ <strong>Senha temporária gerada:</strong></div>
                    <div class="text-xl font-bold tracking-widest text-white bg-black/40 p-2.5 rounded-lg text-center font-mono select-all">${data.tempPassword}</div>
                    <p class="text-xs text-gray-300 mt-1">Sua nova senha temporária para <strong>${email}</strong> é <code>${data.tempPassword}</code>.</p>
                    <button type="button" onclick="document.getElementById('loginEmail').value='${email}'; document.getElementById('loginPassword').value='${data.tempPassword}'; switchAuthTab('login');" class="mt-2 w-full py-2 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-lg transition-colors text-xs uppercase tracking-wider">
                        🔑 Preencher e Entrar Agora →
                    </button>
                `;
                forgotAlert.classList.remove('hidden');
            } else {
                forgotAlert.className = "mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-900/30 border-emerald-500/40 text-emerald-300";
                forgotAlert.innerText = '✅ Instruções de redefinição enviadas para o seu e-mail com sucesso!';
                forgotAlert.classList.remove('hidden');
            }

        } catch (err) {
            alert('Erro ao conectar ao servidor backend na porta 3000. Certifique-se de executar "npm start".');
        } finally {
            btn.disabled = false;
            btn.innerHTML = 'Enviar / Gerar Nova Senha →';
        }
        return false;
    }

    // Engine de Partículas Interativas no Fundo com Física de Mouse
    (function initBgParticles() {
        const canvas = document.getElementById('bgParticlesCanvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const mouse = { x: -1000, y: -1000, radius: 160 };

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mouseleave', () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const count = Math.min(Math.floor(width / 30), 55);

        for (let i = 0; i < count; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                baseVx: (Math.random() - 0.5) * 0.45,
                baseVy: (Math.random() - 0.5) * 0.45,
                vx: (Math.random() - 0.5) * 0.45,
                vy: (Math.random() - 0.5) * 0.45,
                radius: Math.random() * 1.8 + 0.8,
                alpha: Math.random() * 0.5 + 0.25
            });
        }

        function render() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];

                // Atração sutil ao mouse
                const dxMouse = mouse.x - p.x;
                const dyMouse = mouse.y - p.y;
                const distMouse = Math.sqrt(dxMouse * dxMouse + dyMouse * dyMouse);

                if (distMouse < mouse.radius) {
                    const force = (mouse.radius - distMouse) / mouse.radius;
                    p.x += (dxMouse / distMouse) * force * 1.2;
                    p.y += (dyMouse / distMouse) * force * 1.2;
                } else {
                    p.x += p.baseVx;
                    p.y += p.baseVy;
                }

                if (p.x < 0) p.x = width;
                if (p.x > width) p.x = 0;
                if (p.y < 0) p.y = height;
                if (p.y > height) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(6, 214, 160, ${p.alpha})`;
                ctx.fill();

                // Conectar partículas próximas
                for (let j = i + 1; j < particles.length; j++) {
                    const p2 = particles[j];
                    const dx = p.x - p2.x;
                    const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 130) {
                        ctx.beginPath();
                        ctx.moveTo(p.x, p.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(6, 214, 160, ${(1 - dist / 130) * 0.18})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(render);
        }
        render();
    })();

    // Efeito Tilt 3D no Card de Showcase
    (function init3DTilt() {
        const container = document.getElementById('showcaseContainer');
        const card = document.getElementById('tiltCard');
        if (!container || !card) return;

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const rotateX = (-y / rect.height) * 14;
            const rotateY = (x / rect.width) * 14;

            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        container.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg)`;
        });
    })();
    </script>
